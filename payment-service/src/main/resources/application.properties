# =============================================================
# Datasource — Supabase PostgreSQL (mesmo banco compartilhado nesta fase da migração)
# PAYMENT_DB_USERNAME/PAYMENT_DB_PASSWORD permitem apontar para uma role de
# least privilege dedicada (ver database/migrations/0051_least_privilege_roles.sql)
# sem quebrar quem ainda usa a credencial única compartilhada.
# =============================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${PAYMENT_DB_USERNAME:${QUARKUS_DATASOURCE_USERNAME}}
quarkus.datasource.password=${PAYMENT_DB_PASSWORD:${QUARKUS_DATASOURCE_PASSWORD}}

quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30

quarkus.hibernate-orm.database.generation=none

# =============================================================
# JWT — Supabase (ES256). Valida apenas a assinatura/emissor do token; a
# resolução de tenant/membership continua sendo responsabilidade exclusiva do
# subscription-service, que é quem chama este serviço repassando o mesmo
# Authorization recebido do frontend.
# =============================================================
mp.jwt.verify.publickey.location=${SUPABASE_JWT_JWKS_URL}
mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER}
mp.jwt.token.header=Authorization
smallrye.jwt.verify.algorithm=ES256

# =============================================================
# Comunicação serviço-a-serviço com o subscription-service (notificação de
# mudança de status de pagamento). Não usa o Authorization do usuário — o
# webhook do gateway não carrega nenhum JWT de usuário — por isso um segredo
# compartilhado próprio (X-Internal-Token), na mesma linha do padrão já
# documentado para chamadas server-to-server internas da plataforma.
# =============================================================
quarkus.rest-client.subscription-service-api.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8085}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN}

# =============================================================
# Stripe
# Sem default: o boot não deve falhar por causa da secret key (o serviço
# também atende Asaas-only), mas nenhuma chamada Stripe deve ser feita sem
# ela configurada em produção.
# =============================================================
payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# =============================================================
# Asaas
# =============================================================
payment.asaas.api-key=${ASAAS_API_KEY:}
payment.asaas.webhook-token=${ASAAS_WEBHOOK_SECRET:}
quarkus.rest-client.asaas-api.url=${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}

# =============================================================
# CORS — este serviço não é chamado pelo frontend, só pelo subscription-service
# e pelos webhooks dos gateways. CORS mantido por padronização com os demais
# serviços, mas sem necessidade prática de abrir origem de browser.
# =============================================================
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5100}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Tenant-ID,Accept

# Security headers
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# =============================================================
# OpenAPI / Swagger
# =============================================================
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# =============================================================
# Jackson — snake_case e datas como ISO string (compatível com frontend TypeScript)
# =============================================================
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.write-dates-as-timestamps=false

# =============================================================
# App
# =============================================================
quarkus.http.port=8088
quarkus.log.level=INFO
quarkus.log.category."com.saas".level=DEBUG

%dev.quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}
%dev.quarkus.log.level=DEBUG
# Logs JSON (quarkus-logging-json) ligados por padrão; desligados em %dev
# para leitura humana no console local.
%dev.quarkus.log.console.json=false
%dev.quarkus.swagger-ui.always-include=true

# Test — sobrescreve apenas o que é necessário
%test.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/test}
%test.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:test}
%test.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:test}
%test.mp.jwt.verify.publickey.location=${SUPABASE_JWT_JWKS_URL:https://example.invalid/jwks.json}
%test.mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER:https://example.invalid}
%test.app.internal.service-token=test-internal-token
