# Lê automaticamente o arquivo .env na raiz do projeto
# Copie .env.example para .env e preencha os valores antes de rodar

services:
  # -------------------------------------------------------
  # Auth Service (dev mode)
  # Emissão/validação de ProfileAccessToken e ModuleAccessToken.
  # Banco: Supabase (compartilhado com os demais microsserviços Quarkus)
  # -------------------------------------------------------
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    ports:
      - "8082:8082"
    environment:
      # Banco — Supabase (Direct connection)
      - QUARKUS_DATASOURCE_JDBC_URL=${QUARKUS_DATASOURCE_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=${QUARKUS_DATASOURCE_USERNAME}
      - QUARKUS_DATASOURCE_PASSWORD=${QUARKUS_DATASOURCE_PASSWORD}
      # Opcional: AUTH_DB_USERNAME/AUTH_DB_PASSWORD apontam para a role de
      # least privilege dedicada (database/migrations/0051_least_privilege_roles.sql)
      #       - AUTH_DB_USERNAME=${AUTH_DB_USERNAME:-}
      #       - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:-}
      # JWT (Supabase)
      - SUPABASE_JWT_JWKS_URL=${SUPABASE_JWT_JWKS_URL}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      # ProfileAccessToken / ModuleAccessToken (segredos compartilhados com
      # pdf-service/whatsapp-service, que validam esses tokens)
      - MODULE_ACCESS_TOKEN_SECRET=${MODULE_ACCESS_TOKEN_SECRET}
      - PROFILE_ACCESS_TOKEN_SECRET=${PROFILE_ACCESS_TOKEN_SECRET}
      # Subscription Service — resolução de acesso a módulo (assinatura/plano/limites)
      - SUBSCRIPTION_SERVICE_URL=${SUBSCRIPTION_SERVICE_URL:-http://subscription-service:8085}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}

  # -------------------------------------------------------
  # Module Catalog Service (dev mode)
  # Catálogo de módulos/serviços/grupos — somente leitura (GET). Todo CRUD
  # administrativo do catálogo vive em admin-service.
  # Banco: Supabase (mesmo banco, por enquanto)
  # -------------------------------------------------------
  module-catalog-service:
    build:
      context: ./module-catalog-service
      dockerfile: Dockerfile.dev
    ports:
      - "8083:8083"
    environment:
      # Banco — Supabase (Direct connection)
      - QUARKUS_DATASOURCE_JDBC_URL=${QUARKUS_DATASOURCE_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=${QUARKUS_DATASOURCE_USERNAME}
      - QUARKUS_DATASOURCE_PASSWORD=${QUARKUS_DATASOURCE_PASSWORD}
      # Opcional: CATALOG_DB_USERNAME/CATALOG_DB_PASSWORD apontam para a role
      # de least privilege dedicada, somente leitura
      # (database/migrations/0051_least_privilege_roles.sql)
      #       - CATALOG_DB_USERNAME=${CATALOG_DB_USERNAME:-}
      #       - CATALOG_DB_PASSWORD=${CATALOG_DB_PASSWORD:-}
      # JWT (Supabase)
      - SUPABASE_JWT_JWKS_URL=${SUPABASE_JWT_JWKS_URL}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}

  # -------------------------------------------------------
  # Profile Service (dev mode)
  # Tenant (empresa/individual), membros, convites, níveis de acesso.
  # Banco: Supabase (mesmo banco, por enquanto)
  # -------------------------------------------------------
  profile-service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile.dev
    ports:
      - "8084:8084"
    environment:
      # Banco — Supabase (Direct connection)
      - QUARKUS_DATASOURCE_JDBC_URL=${QUARKUS_DATASOURCE_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=${QUARKUS_DATASOURCE_USERNAME}
      - QUARKUS_DATASOURCE_PASSWORD=${QUARKUS_DATASOURCE_PASSWORD}
      # Opcional: PROFILE_DB_USERNAME/PROFILE_DB_PASSWORD apontam para a role
      # de least privilege dedicada (database/migrations/0051_least_privilege_roles.sql)
      #       - PROFILE_DB_USERNAME=${PROFILE_DB_USERNAME:-}
      #       - PROFILE_DB_PASSWORD=${PROFILE_DB_PASSWORD:-}
      # JWT (Supabase)
      - SUPABASE_JWT_JWKS_URL=${SUPABASE_JWT_JWKS_URL}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      # Link base para e-mails de convite
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5100}
      # Mailer (convites por e-mail)
      - QUARKUS_MAILER_FROM=${QUARKUS_MAILER_FROM:-noreply@localhost}
      - QUARKUS_MAILER_HOST=${QUARKUS_MAILER_HOST:-localhost}
      - QUARKUS_MAILER_PORT=${QUARKUS_MAILER_PORT:-1025}
      - QUARKUS_MAILER_USERNAME=${QUARKUS_MAILER_USERNAME:-}
      - QUARKUS_MAILER_PASSWORD=${QUARKUS_MAILER_PASSWORD:-}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}

  # -------------------------------------------------------
  # Subscription Service (dev mode)
  # Planos, assinaturas de módulo, trials, configurações da plataforma.
  # Banco: Supabase (mesmo banco, por enquanto)
  # -------------------------------------------------------
  subscription-service:
    build:
      context: ./subscription-service
      dockerfile: Dockerfile.dev
    ports:
      - "8085:8085"
    environment:
      # Banco — Supabase (Direct connection)
      - QUARKUS_DATASOURCE_JDBC_URL=${QUARKUS_DATASOURCE_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=${QUARKUS_DATASOURCE_USERNAME}
      - QUARKUS_DATASOURCE_PASSWORD=${QUARKUS_DATASOURCE_PASSWORD}
      # Opcional: SUBSCRIPTION_DB_USERNAME/SUBSCRIPTION_DB_PASSWORD apontam
      # para a role de least privilege dedicada
      # (database/migrations/0051_least_privilege_roles.sql)
      #       - SUBSCRIPTION_DB_USERNAME=${SUBSCRIPTION_DB_USERNAME:-}
      #       - SUBSCRIPTION_DB_PASSWORD=${SUBSCRIPTION_DB_PASSWORD:-}
      # JWT (Supabase)
      - SUPABASE_JWT_JWKS_URL=${SUPABASE_JWT_JWKS_URL}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}

  # -------------------------------------------------------
  # Usage Service (dev mode)
  # Contadores de uso diário, quota/rate-limit e auditoria de uso de módulo.
  # Chamado via ModuleAccessToken pelos serviços de módulo (PDF, WhatsApp, futuros).
  # Banco: Supabase (mesmo banco, por enquanto)
  # -------------------------------------------------------
  usage-service:
    build:
      # Contexto na raiz do repo: o Dockerfile.dev precisa instalar
      # libs/platform-module-security-quarkus no repositório Maven local antes
      # de compilar o serviço (ver libs/platform-module-security-quarkus/README.md).
      context: .
      dockerfile: usage-service/Dockerfile.dev
    ports:
      - "8086:8086"
    environment:
      # Banco — Supabase (Direct connection)
      - QUARKUS_DATASOURCE_JDBC_URL=${QUARKUS_DATASOURCE_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=${QUARKUS_DATASOURCE_USERNAME}
      - QUARKUS_DATASOURCE_PASSWORD=${QUARKUS_DATASOURCE_PASSWORD}
      # Opcional: USAGE_DB_USERNAME/USAGE_DB_PASSWORD apontam para a role de
      # least privilege dedicada (database/migrations/0051_least_privilege_roles.sql)
      #       - USAGE_DB_USERNAME=${USAGE_DB_USERNAME:-}
      #       - USAGE_DB_PASSWORD=${USAGE_DB_PASSWORD:-}
      # ModuleAccessToken (validação local, mesmo segredo do auth-service)
      - MODULE_ACCESS_TOKEN_SECRET=${MODULE_ACCESS_TOKEN_SECRET}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}

  # -------------------------------------------------------
  # Admin Service (dev mode)
  # Tenants, clientes, usuários administrativos, níveis de acesso e visão
  # admin de assinaturas. Usado apenas pelo Frontend Administrativo.
  # Banco: Supabase (mesmo banco, por enquanto)
  # -------------------------------------------------------
  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile.dev
    ports:
      - "8087:8087"
    environment:
      # Banco — Supabase (Direct connection)
      - QUARKUS_DATASOURCE_JDBC_URL=${QUARKUS_DATASOURCE_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=${QUARKUS_DATASOURCE_USERNAME}
      - QUARKUS_DATASOURCE_PASSWORD=${QUARKUS_DATASOURCE_PASSWORD}
      # Opcional: ADMIN_DB_USERNAME/ADMIN_DB_PASSWORD apontam para a role de
      # least privilege dedicada (database/migrations/0051_least_privilege_roles.sql)
      #       - ADMIN_DB_USERNAME=${ADMIN_DB_USERNAME:-}
      #       - ADMIN_DB_PASSWORD=${ADMIN_DB_PASSWORD:-}
      # JWT (Supabase)
      - SUPABASE_JWT_JWKS_URL=${SUPABASE_JWT_JWKS_URL}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      # Supabase Admin API (opcional — criação/reset de senha de usuários admin)
      # Sem prefixo VITE_: essa service-role key nunca deve ser confundida com
      # uma variável de build-time de frontend.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Mailer (criação/reset de senha de usuários admin)
      - QUARKUS_MAILER_FROM=${QUARKUS_MAILER_FROM:-noreply@localhost}
      - QUARKUS_MAILER_HOST=${QUARKUS_MAILER_HOST:-localhost}
      - QUARKUS_MAILER_PORT=${QUARKUS_MAILER_PORT:-1025}
      - QUARKUS_MAILER_USERNAME=${QUARKUS_MAILER_USERNAME:-}
      - QUARKUS_MAILER_PASSWORD=${QUARKUS_MAILER_PASSWORD:-}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}
      # subscription-service — só para ações administrativas que escrevem em
      # tabelas daquele serviço (ex.: cancelar/reativar assinatura). O
      # frontend-admin nunca fala com subscription-service diretamente.
      - SUBSCRIPTION_SERVICE_URL=${SUBSCRIPTION_SERVICE_URL:-http://subscription-service:8085}
    depends_on:
      - subscription-service

  # -------------------------------------------------------
  # PDF Service (FastAPI)
  # Módulo PDF (merge, histórico de jobs, download). Frontend chama direto
  # (VITE_PDF_API_URL).
  # -------------------------------------------------------
  pdf-service:
    build:
      context: .
      dockerfile: pdf-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MODULE_ACCESS_TOKEN_SECRET=${MODULE_ACCESS_TOKEN_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # "json" (padrão, Google Cloud Logging) ou "text" (legível, debug local)
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}
      - PDF_STORAGE_PATH=/tmp/saas-pdf
    volumes:
      - pdf-storage:/tmp/saas-pdf

  # -------------------------------------------------------
  # WhatsApp Service (FastAPI, dev mode)
  # Estrutura inicial — mensageria WhatsApp. Frontend chama direto
  # (VITE_WHATSAPP_API_URL).
  # -------------------------------------------------------
  whatsapp-service:
    build:
      context: .
      dockerfile: whatsapp-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - MODULE_ACCESS_TOKEN_SECRET=${MODULE_ACCESS_TOKEN_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # "json" (padrão, Google Cloud Logging) ou "text" (legível, debug local)
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5100,http://localhost:5101,http://localhost:5102,http://localhost:5200}

  # -------------------------------------------------------
  # PDF Frontend (Micro Frontend, Module Federation remote)
  # Exclusivo do módulo PDF — chama só o pdf-service. Carregado sob demanda
  # pelo Front Host via Module Federation (remoteEntry.js).
  # -------------------------------------------------------
  pdf-frontend:
    build:
      context: ./pdf-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5101:5101"
    volumes:
      - ./pdf-frontend:/app
      - /app/node_modules
    environment:
      - VITE_PDF_API_URL=${VITE_PDF_API_URL:-http://localhost:8001}
    depends_on:
      - pdf-service

  # -------------------------------------------------------
  # WhatsApp Frontend (Micro Frontend, Module Federation remote)
  # Exclusivo do módulo WhatsApp — chama só o whatsapp-service. Carregado sob
  # demanda pelo Front Host via Module Federation (remoteEntry.js).
  # -------------------------------------------------------
  whatsapp-frontend:
    build:
      context: ./whatsapp-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5102:5102"
    volumes:
      - ./whatsapp-frontend:/app
      - /app/node_modules
    environment:
      - VITE_WHATSAPP_API_URL=${VITE_WHATSAPP_API_URL:-http://localhost:8002}
    depends_on:
      - whatsapp-service

  # -------------------------------------------------------
  # Front Host (Module Federation host)
  # Login, dashboard, navegação e estado global. Carrega os Micro Frontends
  # de módulo (pdf-frontend, whatsapp-frontend) sob demanda via Module
  # Federation — nunca chama o backend de um módulo diretamente.
  # -------------------------------------------------------
  frontend-host:
    build:
      context: ./frontend-host
      dockerfile: Dockerfile.dev
    ports:
      - "5100:5100"
    volumes:
      - ./frontend-host:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_AUTH_API_URL=${VITE_AUTH_API_URL:-http://localhost:8082}
      - VITE_CATALOG_API_URL=${VITE_CATALOG_API_URL:-http://localhost:8083}
      - VITE_PROFILE_API_URL=${VITE_PROFILE_API_URL:-http://localhost:8084}
      - VITE_SUBSCRIPTION_API_URL=${VITE_SUBSCRIPTION_API_URL:-http://localhost:8085}
      - VITE_ADMIN_APP_URL=${VITE_ADMIN_APP_URL:-http://localhost:5200}
      - VITE_PDF_REMOTE_URL=${VITE_PDF_REMOTE_URL:-http://localhost:5101}
      - VITE_WHATSAPP_REMOTE_URL=${VITE_WHATSAPP_REMOTE_URL:-http://localhost:5102}
    depends_on:
      - auth-service
      - module-catalog-service
      - profile-service
      - subscription-service
      - pdf-frontend
      - whatsapp-frontend

  # -------------------------------------------------------
  # Frontend Admin (projeto React independente)
  # Usado só por administradores da plataforma. Consome exclusivamente o
  # Admin Service (e o Auth do Supabase para login) — nunca Auth Service (fora
  # de login)/Profile/Subscription/Module Catalog/Usage/PDF/WhatsApp Service
  # diretamente. Ações que escrevem em tabelas de outro serviço (ex.:
  # cancelar assinatura) passam pelo Admin Service, que repassa internamente
  # (ver com.saas.admin.controller.AdminSubscriptionResource). Não é federado
  # no Host.
  # -------------------------------------------------------
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile.dev
    ports:
      - "5200:5200"
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_ADMIN_API_URL=${VITE_ADMIN_API_URL:-http://localhost:8087}
    depends_on:
      - admin-service

volumes:
  pdf-storage:
