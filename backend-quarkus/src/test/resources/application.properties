# Banco de dados: usa as mesmas variáveis de ambiente do .env
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.hibernate-orm.database.generation=none

# JWT: usa JWKS local (mesma chave pública do Supabase, sem dependência de rede)
mp.jwt.verify.publickey.location=test-jwks.json
mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER}
smallrye.jwt.verify.algorithm=ES256

# Desativa scheduler nos testes para não disparar jobs
quarkus.scheduler.enabled=false

# Log
quarkus.log.level=WARN
quarkus.log.category."com.saas".level=DEBUG
