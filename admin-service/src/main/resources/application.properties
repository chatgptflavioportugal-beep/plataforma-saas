# =============================================================
# Datasource — Supabase PostgreSQL (mesmo banco compartilhado nesta fase da migração)
# ADMIN_DB_USERNAME/ADMIN_DB_PASSWORD permitem apontar para uma role de least
# privilege dedicada (ver database/migrations/0051_least_privilege_roles.sql)
# sem quebrar quem ainda usa a credencial única compartilhada.
# =============================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${ADMIN_DB_USERNAME:${QUARKUS_DATASOURCE_USERNAME}}
quarkus.datasource.password=${ADMIN_DB_PASSWORD:${QUARKUS_DATASOURCE_PASSWORD}}

quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30

quarkus.hibernate-orm.database.generation=none

# =============================================================
# JWT — Supabase (ES256)
# =============================================================
mp.jwt.verify.publickey.location=${SUPABASE_JWT_JWKS_URL}
mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER}
mp.jwt.token.header=Authorization
mp.jwt.token.cookie=
smallrye.jwt.verify.algorithm=ES256

# =============================================================
# REST Client — subscription-service (cancelar/reativar assinatura em nome
# de um admin; profile_module_subscriptions pertence a subscription-service)
# =============================================================
quarkus.rest-client.subscription-service-api.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8085}

# =============================================================
# Supabase Admin API — usado apenas por AdminUsersResource para criar/
# resetar senha de usuários administrativos.
# =============================================================
supabase.url=${VITE_SUPABASE_URL:}
supabase.service-role-key=${VITE_SUPABASE_SERVICE_ROLE_KEY:}

# =============================================================
# Mailer — e-mails de criação/reset de senha de usuários admin
# =============================================================
quarkus.mailer.from=${QUARKUS_MAILER_FROM:noreply@localhost}
quarkus.mailer.host=${QUARKUS_MAILER_HOST:localhost}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:1025}
quarkus.mailer.ssl=false
quarkus.mailer.start-tls=DISABLED

%dev.quarkus.mailer.mock=false
%dev.quarkus.mailer.host=smtp.gmail.com
%dev.quarkus.mailer.port=587
%dev.quarkus.mailer.ssl=false
%dev.quarkus.mailer.start-tls=REQUIRED
%dev.quarkus.mailer.username=${QUARKUS_MAILER_USERNAME:}
%dev.quarkus.mailer.password=${QUARKUS_MAILER_PASSWORD:}
%dev.quarkus.mailer.from=${QUARKUS_MAILER_FROM:}

# =============================================================
# CORS
# =============================================================
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Tenant-ID,Accept

# Security headers
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# =============================================================
# OpenAPI / Swagger
# =============================================================
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# =============================================================
# Jackson — snake_case e datas como ISO string (compatível com frontend TypeScript)
# =============================================================
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.write-dates-as-timestamps=false

# =============================================================
# App
# =============================================================
quarkus.http.port=8087
quarkus.log.level=INFO
quarkus.log.category."com.saas".level=DEBUG

%dev.quarkus.http.cors.origins=http://localhost:3000
%dev.quarkus.log.level=DEBUG
%dev.quarkus.swagger-ui.always-include=true

# Test — sobrescreve apenas o que é necessário
%test.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%test.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%test.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
%test.quarkus.mailer.mock=true
