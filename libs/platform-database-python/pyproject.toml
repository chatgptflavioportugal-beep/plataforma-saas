[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-database-python"
version = "0.1.0"
description = "Biblioteca compartilhada de acesso a dados para os microsservicos Python de modulo da plataforma (pool asyncpg + native query -> TO)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_database_python"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
