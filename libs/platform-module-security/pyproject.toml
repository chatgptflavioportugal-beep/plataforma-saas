[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-module-security"
version = "0.1.0"
description = "Biblioteca compartilhada de autenticacao/autorizacao para os microsservicos Python de modulo da plataforma (validacao do ModuleAccessToken emitido pelo auth-service)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_security"]
