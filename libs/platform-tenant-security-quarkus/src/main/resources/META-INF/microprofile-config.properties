# =============================================================
# JWT — Supabase (ES256)
# Default compartilhado para todo servico que depende desta lib. Lido pelo
# SmallRye Config a partir do classpath (mecanismo padrao do MicroProfile
# Config para uma lib publicar defaults) — nao precisa ser redeclarado no
# application.properties do servico consumidor. As env vars continuam vindas
# do ambiente de cada servico (.env / docker-compose), nada muda em runtime.
# =============================================================
mp.jwt.verify.publickey.location=${SUPABASE_JWT_JWKS_URL}
mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER}
mp.jwt.token.header=Authorization
mp.jwt.token.cookie=
smallrye.jwt.verify.algorithm=ES256
