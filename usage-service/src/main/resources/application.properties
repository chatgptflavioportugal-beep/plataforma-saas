# =============================================================
# Datasource — Supabase PostgreSQL (mesmo banco compartilhado nesta fase da migração)
# =============================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30

quarkus.hibernate-orm.database.generation=none

# =============================================================
# ModuleAccessToken (JJWT, HS256) — mesmo segredo emitido pelo auth-service
# =============================================================
app.token.module-secret=${MODULE_ACCESS_TOKEN_SECRET:d4b94100e515ef881930207b5029115f5a1519c0552b5a221ddde791c908d68b}

# =============================================================
# CORS
# =============================================================
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Tenant-ID,Accept

# Security headers
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# =============================================================
# OpenAPI / Swagger
# =============================================================
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# =============================================================
# Jackson — snake_case e datas como ISO string (compatível com frontend TypeScript)
# =============================================================
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.write-dates-as-timestamps=false

# =============================================================
# App
# =============================================================
quarkus.http.port=8086
quarkus.log.level=INFO
quarkus.log.category."com.saas".level=DEBUG

%dev.quarkus.http.cors.origins=http://localhost:3000
%dev.quarkus.log.level=DEBUG
%dev.quarkus.swagger-ui.always-include=true

# Test — sobrescreve apenas o que é necessário
%test.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%test.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%test.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
